[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "Agentic RAG reference app: LangGraph agent, LlamaIndex retrieval, FastAPI streaming API"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
